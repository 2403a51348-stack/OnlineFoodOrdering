
<!DOCTYPE html>
<html>
<head>
    <title>Online Food Ordering System</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #fff3e0;
        }

        h1 {
            background-color: #e65100;
            color: white;
            padding: 20px;
        }

        .food {
            display: inline-block;
            background: white;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            width: 200px;
        }

        button {
            background: #e65100;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Online Food Ordering System</h1>

<h2>Our Food Menu</h2>

<div class="food">
    <h3>Pizza</h3>
    <p>Price: Rs.200</p>
    <button onclick="order('Pizza')">Order Now</button>
</div>

<div class="food">
    <h3>Burger</h3>
    <p>Price: Rs.120</p>
    <button onclick="order('Burger')">Order Now</button>
</div>

<div class="food">
    <h3>Biryani</h3>
    <p>Price: Rs.180</p>
    <button onclick="order('Biryani')">Order Now</button>
</div>

<script>
    function order(food) {
        alert(food + " ordered successfully!");
    }
</script>

</body>
</html>
